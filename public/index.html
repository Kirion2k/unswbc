<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNSW Badminton Club</title>
    <meta name="description" content="Welcome to the UNSW Badminton Club official website. Join us for weekly sessions, tournaments, and lots of badminton!" />
    <meta name="author" content="UNSW Badminton Club" />
    <meta name="keywords" content="Badminton, UNSW, Sports, Club, UNSWBC, Training" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/logo-white.png" fetchpriority="high" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/unsw-64.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/unsw-14.jpg" fetchpriority="low" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/unsw-20.jpg" fetchpriority="low" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/unsw-81.JPG" fetchpriority="low" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/unsw-58.jpg" fetchpriority="low" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/unsw-8.jpg" fetchpriority="low" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/unsw-12.jpg" fetchpriority="low" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/unsw-59.jpg" fetchpriority="low" />
  </head>
  <body>

    <!-- ─── Initial loader ──────────────────────────────────────────────────── -->
    <div id="initial-loader" aria-label="Loading" data-min-ms="1800">

      <!-- Rally scene -->
      <div class="il-scene" aria-hidden="true">

        <!-- Left player (faces right) -->
        <svg class="il-player il-player--left"
             viewBox="-5 -14 95 102"
             width="80" height="80"
             fill="none" xmlns="http://www.w3.org/2000/svg">

          <!-- shadow -->
          <ellipse cx="40" cy="88" rx="15" ry="3" fill="rgba(0,0,0,0.22)"/>

          <!-- legs -->
          <line x1="40" y1="55" x2="27" y2="80" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <line x1="40" y1="55" x2="53" y2="80" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <!-- feet -->
          <line x1="27" y1="80" x2="17" y2="80" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <line x1="53" y1="80" x2="63" y2="80" stroke="white" stroke-width="3" stroke-linecap="round"/>

          <!-- torso -->
          <line x1="40" y1="24" x2="40" y2="55" stroke="white" stroke-width="3" stroke-linecap="round"/>

          <!-- balance arm (away from net) -->
          <line x1="40" y1="34" x2="17" y2="46" stroke="white" stroke-width="2.2" stroke-linecap="round"/>

          <!-- racket arm — animates around shoulder (40,34) -->
          <g class="il-arm il-arm--p1" style="transform-origin:40px 34px">
            <line x1="40" y1="34" x2="60" y2="23" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
            <line x1="60" y1="23" x2="70" y2="13" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <!-- handle -->
            <line x1="70" y1="13" x2="77" y2="5" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round"/>
            <!-- racket frame -->
            <ellipse cx="82" cy="0" rx="8" ry="11"
                     stroke="rgba(255,255,255,0.85)" stroke-width="2"
                     transform="rotate(-25,82,0)"/>
            <!-- string cross -->
            <line x1="76" y1="-5" x2="88" y2="5"  stroke="rgba(255,255,255,0.28)" stroke-width="0.9"/>
            <line x1="76" y1="5"  x2="88" y2="-5" stroke="rgba(255,255,255,0.28)" stroke-width="0.9"/>
          </g>

          <!-- head -->
          <circle cx="40" cy="12" r="12" fill="rgba(255,255,255,0.09)" stroke="white" stroke-width="2.5"/>
          <!-- eyes (look toward net) -->
          <circle cx="37" cy="10" r="2"   fill="white"/>
          <circle cx="45" cy="10" r="2"   fill="white"/>
          <!-- pupils -->
          <circle cx="38" cy="10" r="0.9" fill="#0a1628"/>
          <circle cx="46" cy="10" r="0.9" fill="#0a1628"/>
          <!-- smile -->
          <path d="M 35 17 Q 40 22 45 17" stroke="white" stroke-width="1.7" fill="none" stroke-linecap="round"/>
          <!-- cheek blush dots -->
          <circle cx="33" cy="15" r="2.5" fill="rgba(255,160,160,0.35)"/>
          <circle cx="47" cy="15" r="2.5" fill="rgba(255,160,160,0.35)"/>
          <!-- hair tufts -->
          <line x1="33" y1="2"  x2="31" y2="-6" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="40" y1="0"  x2="40" y2="-8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="47" y1="2"  x2="49" y2="-6" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        </svg>

        <!-- Net post -->
        <div class="il-net">
          <div class="il-net-top"></div>
        </div>

        <!-- Right player — identical SVG, CSS mirrors it and uses p2 arm timing -->
        <svg class="il-player il-player--right"
             viewBox="-5 -14 95 102"
             width="80" height="80"
             fill="none" xmlns="http://www.w3.org/2000/svg">

          <ellipse cx="40" cy="88" rx="15" ry="3" fill="rgba(0,0,0,0.22)"/>
          <line x1="40" y1="55" x2="27" y2="80" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <line x1="40" y1="55" x2="53" y2="80" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <line x1="27" y1="80" x2="17" y2="80" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <line x1="53" y1="80" x2="63" y2="80" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <line x1="40" y1="24" x2="40" y2="55" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <line x1="40" y1="34" x2="17" y2="46" stroke="white" stroke-width="2.2" stroke-linecap="round"/>

          <g class="il-arm il-arm--p2" style="transform-origin:40px 34px">
            <line x1="40" y1="34" x2="60" y2="23" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
            <line x1="60" y1="23" x2="70" y2="13" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <line x1="70" y1="13" x2="77" y2="5" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round"/>
            <ellipse cx="82" cy="0" rx="8" ry="11"
                     stroke="rgba(255,255,255,0.85)" stroke-width="2"
                     transform="rotate(-25,82,0)"/>
            <line x1="76" y1="-5" x2="88" y2="5"  stroke="rgba(255,255,255,0.28)" stroke-width="0.9"/>
            <line x1="76" y1="5"  x2="88" y2="-5" stroke="rgba(255,255,255,0.28)" stroke-width="0.9"/>
          </g>

          <circle cx="40" cy="12" r="12" fill="rgba(255,255,255,0.09)" stroke="white" stroke-width="2.5"/>
          <circle cx="37" cy="10" r="2"   fill="white"/>
          <circle cx="45" cy="10" r="2"   fill="white"/>
          <circle cx="38" cy="10" r="0.9" fill="#0a1628"/>
          <circle cx="46" cy="10" r="0.9" fill="#0a1628"/>
          <path d="M 35 17 Q 40 22 45 17" stroke="white" stroke-width="1.7" fill="none" stroke-linecap="round"/>
          <circle cx="33" cy="15" r="2.5" fill="rgba(255,160,160,0.35)"/>
          <circle cx="47" cy="15" r="2.5" fill="rgba(255,160,160,0.35)"/>
          <line x1="33" y1="2"  x2="31" y2="-6" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="40" y1="0"  x2="40" y2="-8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="47" y1="2"  x2="49" y2="-6" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        </svg>

        <!-- Shuttle: wrapper translates (rally arc), image rotates (spin) -->
        <div class="il-shuttle-wrap">
          <img
            class="il-shuttle"
            src="/logo-white.png"
            alt=""
            onerror="this.onerror=null;this.src='/unswbc-shuttle.svg';"
          />
        </div>

        <!-- Court floor line -->
        <div class="il-floor"></div>

      </div><!-- /.il-scene -->

      <!-- Text -->
      <div class="il-text">
        <div class="il-title">UNSW Badminton Club</div>
        <div class="il-dots" aria-hidden="true">
          <span class="il-dot"></span>
          <span class="il-dot"></span>
          <span class="il-dot"></span>
        </div>
      </div>

    </div>
    <!-- ────────────────────────────────────────────────────────────────────── -->

    <div id="root"></div>

    <script>
      window.__INITIAL_LOADER_START__ = (window.performance && performance.now) ? performance.now() : Date.now();
    </script>

    <style>
      /* ── Base ──────────────────────────────────────────────────────────── */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        background:
          radial-gradient(ellipse 860px 480px at 50% 40%, rgba(28,60,111,0.45), transparent),
          linear-gradient(160deg, #0d1b2e 0%, #020817 60%, #050f1f 100%);
        color: #fff;
        z-index: 9999;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        transition: opacity 380ms ease, transform 380ms ease;
      }
      #initial-loader.initial-loader--hide {
        opacity: 0;
        transform: scale(1.025);
        pointer-events: none;
      }

      /* ── Rally scene ───────────────────────────────────────────────────── */
      .il-scene {
        position: relative;
        width: min(88vw, 320px);
        height: 160px;
        overflow: visible;
      }

      /* ── Players ───────────────────────────────────────────────────────── */
      .il-player {
        position: absolute;
        bottom: 4px;
        overflow: visible;
      }
      .il-player--left  { left: 0; }
      /* Mirror right player so racket faces left (toward net) */
      .il-player--right {
        right: 0;
        transform: scaleX(-1);
      }

      /* ── Net ───────────────────────────────────────────────────────────── */
      .il-net {
        position: absolute;
        left: 50%;
        bottom: 4px;
        width: 2px;
        height: 78px;
        transform: translateX(-50%);
        background: linear-gradient(
          to top,
          rgba(255,255,255,0.45),
          rgba(255,255,255,0.1)
        );
        border-radius: 1px;
      }
      /* Net top crossbar */
      .il-net-top {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 14px;
        height: 2px;
        background: rgba(255,255,255,0.5);
        border-radius: 1px;
      }

      /* ── Court floor line ──────────────────────────────────────────────── */
      .il-floor {
        position: absolute;
        bottom: 4px;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          to right,
          transparent,
          rgba(255,255,255,0.18) 20%,
          rgba(255,255,255,0.18) 80%,
          transparent
        );
      }

      /* ── Shuttle wrapper — handles the arc translation ─────────────────── */
      .il-shuttle-wrap {
        position: absolute;
        left: 62px;
        bottom: 62px;
        width: 20px;
        height: 20px;
        animation: il-rally 2.4s linear infinite;
        pointer-events: none;
      }

      /* ── Shuttle image — rotates to face direction of travel ────────────── */
      .il-shuttle {
        width: 20px;
        height: 20px;
        object-fit: contain;
        filter:
          drop-shadow(0 2px 6px rgba(0,0,0,0.55))
          drop-shadow(0 0 8px rgba(255,255,255,0.22));
        animation: il-spin-cw 0.4s linear infinite;
        will-change: transform;
      }

      /* ── Racket arm ────────────────────────────────────────────────────── */
      .il-arm {
        animation-duration: 2.4s;
        animation-iteration-count: infinite;
        animation-timing-function: ease-in-out;
      }
      /* Left player: hits at 0 % and 100 % */
      .il-arm--p1 { animation-name: il-arm-p1; }
      /* Right player (scaleX-1 parent): hits at 50 % — rotations negated due to mirror */
      .il-arm--p2 { animation-name: il-arm-p2; }

      /* ── Text block ────────────────────────────────────────────────────── */
      .il-text {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .il-title {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.82);
      }

      /* ── Loading dots ──────────────────────────────────────────────────── */
      .il-dots {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .il-dot {
        display: block;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(91,163,245,0.75);
        animation: il-dot-pulse 1.5s ease-in-out infinite;
      }
      .il-dot:nth-child(2) { animation-delay: 0.22s; }
      .il-dot:nth-child(3) { animation-delay: 0.44s; }

      /* ── Keyframes ─────────────────────────────────────────────────────── */

      /*
       * Rally arc: shuttle travels 172px right then back, peaking 56px above
       * baseline at the midpoint of each leg (25% and 75%).
       * Per-keyframe timing functions give natural parabolic feel:
       *   ease-in  at the bottom = accelerates downward
       *   ease-out at the peak   = decelerates into the arc top
       */
      @keyframes il-rally {
        0%   {
          transform: translate(0px,   0px);
          animation-timing-function: ease-in;
        }
        25%  {
          transform: translate(86px, -56px);
          animation-timing-function: ease-out;
        }
        50%  {
          transform: translate(172px,  0px);
          animation-timing-function: ease-in;
        }
        75%  {
          transform: translate(86px, -56px);
          animation-timing-function: ease-out;
        }
        100% {
          transform: translate(0px,   0px);
        }
      }

      @keyframes il-spin-cw {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /*
       * Left player arm — pivot at shoulder (40px, 34px in SVG).
       * At 0 %/100 %: follow-through (arm swept forward = +28 deg clockwise).
       * Around 90 %: backswing prep (−22 deg).
       * Between: neutral ready stance.
       */
      @keyframes il-arm-p1 {
        0%         { transform: rotate( 28deg); }
        12%        { transform: rotate(-18deg); }
        70%        { transform: rotate( -6deg); }
        88%        { transform: rotate(-22deg); }
        100%       { transform: rotate( 28deg); }
      }

      /*
       * Right player arm — same SVG but parent has scaleX(-1).
       * Positive rotation appears CCW in screen space after the flip,
       * so we negate the values to get the correct visual direction.
       * Hits at 50 %.
       */
      @keyframes il-arm-p2 {
        0%         { transform: rotate(  6deg); }
        38%        { transform: rotate( 22deg); }
        50%        { transform: rotate(-28deg); }
        62%        { transform: rotate( 18deg); }
        100%       { transform: rotate(  6deg); }
      }

      /* Loading dots pulse */
      @keyframes il-dot-pulse {
        0%,  80%, 100% { opacity: 0.28; transform: scale(0.75); }
        40%            { opacity: 1.00; transform: scale(1.25); }
      }

      /* ── Reduced motion ────────────────────────────────────────────────── */
      @media (prefers-reduced-motion: reduce) {
        .il-shuttle-wrap { animation: none; transform: translate(86px, -56px); }
        .il-shuttle      { animation: none; transform: none; }
        .il-arm          { animation: none; }
        .il-dot          { animation: none; opacity: 0.5; }
      }
    </style>
  </body>
</html>
