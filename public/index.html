<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNSW Badminton Club</title>
    <meta name="description" content="Welcome to the UNSW Badminton Club official website. Join us for weekly sessions, tournaments, and lots of badminton!" />
    <meta name="author" content="UNSW Badminton Club" />
    <meta name="keywords" content="Badminton, UNSW, Sports, Club, UNSWBC, Training" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" /> 
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Initial loader (shows before React bundles finish loading) -->
    <div id="initial-loader" aria-label="Loading" data-min-ms="1800">
      <div class="initial-loader__stage" aria-hidden="true">
        <div class="initial-loader__halo" aria-hidden="true"></div>
        <img
          class="initial-loader__logo"
          src="/logo-white.png"
          alt=""
          onerror="this.onerror=null;this.src='/unswbc-shuttle.svg';"
        />
      </div>
      <div class="initial-loader__text">
        <div class="initial-loader__title">UNSW Badminton Club</div>
        <div class="initial-loader__subtitle">Loading…</div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Used to ensure the loader stays visible for at least a minimum duration.
      window.__INITIAL_LOADER_START__ = (window.performance && performance.now) ? performance.now() : Date.now();
    </script>

    <style>
      /* Minimal inline CSS so loader looks good before app CSS loads */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 16px;
        background:
          radial-gradient(900px 520px at 50% 35%, rgba(28, 60, 111, 0.55), rgba(2, 6, 23, 0.92)),
          linear-gradient(to bottom, #0b1220, #020617);
        color: rgba(255, 255, 255, 0.92);
        z-index: 9999;
        transition: opacity 320ms ease, transform 320ms ease;
      }
      #initial-loader.initial-loader--hide {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }
      .initial-loader__stage {
        width: 220px;
        height: 220px;
        position: relative;
        overflow: visible;
        display: grid;
        place-items: center;
      }
      .initial-loader__halo {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 168px;
        height: 168px;
        transform: translate(-50%, -50%);
        border-radius: 999px;
        background:
          radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.20), rgba(255, 255, 255, 0) 62%),
          radial-gradient(circle at 50% 60%, rgba(28, 60, 111, 0.55), rgba(28, 60, 111, 0) 68%);
        filter: blur(10px);
        opacity: 0.7;
        animation: halo-pulse 1600ms ease-in-out infinite;
        z-index: 1;
        pointer-events: none;
      }
      .initial-loader__logo {
        width: 108px;
        height: 108px;
        display: block;
        object-fit: contain;
        image-rendering: auto;
        filter:
          drop-shadow(0 14px 28px rgba(2, 6, 23, 0.55))
          drop-shadow(0 0 18px rgba(255, 255, 255, 0.18));
        animation: logo-pulse 1400ms ease-in-out infinite;
        will-change: opacity, transform;
        z-index: 2;
      }
      .initial-loader__text {
        text-align: center;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }
      .initial-loader__title {
        font-weight: 800;
        letter-spacing: -0.01em;
        font-size: 18px;
      }
      .initial-loader__subtitle {
        margin-top: 6px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.78);
        font-size: 14px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      @keyframes logo-pulse {
        0%, 100% { opacity: 0.50; transform: translateY(4px) scale(0.97); filter: drop-shadow(0 14px 28px rgba(2, 6, 23, 0.55)) drop-shadow(0 0 12px rgba(255, 255, 255, 0.12)); }
        50% { opacity: 1; transform: translateY(-2px) scale(1.03); filter: drop-shadow(0 18px 34px rgba(2, 6, 23, 0.62)) drop-shadow(0 0 22px rgba(255, 255, 255, 0.22)); }
      }
      @keyframes halo-pulse {
        0%, 100% { opacity: 0.45; transform: translate(-50%, -50%) scale(0.92); }
        50% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.05); }
      }
      @media (prefers-reduced-motion: reduce) {
        .initial-loader__logo { animation: none; opacity: 1; transform: none; }
        .initial-loader__halo { animation: none; opacity: 0.75; transform: translate(-50%, -50%); }
      }
    </style>
  </body>
</html>
