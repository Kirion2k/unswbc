<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var saved;
        try { saved = sessionStorage.getItem('unswbc-theme'); } catch (e) {}
        var hour = new Date().getHours();
        var mode = saved === 'light' || saved === 'dark' ? saved :
          (hour >= 7 && hour < 19 ? 'light' : 'dark');
        document.documentElement.dataset.theme = mode;
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
    <title>UNSW Badminton Club</title>
    <meta name="description" content="Welcome to the UNSW Badminton Club official website. Join us for weekly sessions, tournaments, and lots of badminton!" />
    <meta name="author" content="UNSW Badminton Club" />
    <meta name="keywords" content="Badminton, UNSW, Sports, Club, UNSWBC, Training" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/logo-white.png" fetchpriority="high" />
    <link rel="preload" as="image" href="%PUBLIC_URL%/optimized/unsw-64.jpg" fetchpriority="high" />
  </head>
  <body>

    <!-- ─── Initial loader ──────────────────────────────────────────────────── -->
    <div id="initial-loader" role="status" aria-label="Loading UNSW Badminton Club" data-min-ms="1800">

      <!-- Rally scene -->
      <div class="il-scene" aria-hidden="true">

        <!-- Left player (faces right) -->
        <svg class="il-player il-player--left"
             viewBox="-5 -14 95 102"
             width="80" height="80"
             fill="none" xmlns="http://www.w3.org/2000/svg">

          <!-- shadow -->
          <ellipse cx="40" cy="88" rx="15" ry="3" fill="rgba(0,0,0,0.22)"/>

          <!-- legs -->
          <line x1="40" y1="55" x2="27" y2="80" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <line x1="40" y1="55" x2="53" y2="80" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <!-- feet -->
          <line x1="27" y1="80" x2="17" y2="80" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <line x1="53" y1="80" x2="63" y2="80" stroke="white" stroke-width="3" stroke-linecap="round"/>

          <!-- torso -->
          <line x1="40" y1="24" x2="40" y2="55" stroke="white" stroke-width="3" stroke-linecap="round"/>

          <!-- balance arm (away from net) -->
          <line x1="40" y1="34" x2="17" y2="46" stroke="white" stroke-width="2.2" stroke-linecap="round"/>

          <!-- racket arm — animates around shoulder (40,34) -->
          <g class="il-arm il-arm--p1" style="transform-origin:40px 34px">
            <line x1="40" y1="34" x2="60" y2="23" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
            <line x1="60" y1="23" x2="70" y2="13" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <!-- handle -->
            <line x1="70" y1="13" x2="77" y2="5" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round"/>
            <!-- racket frame -->
            <ellipse cx="82" cy="0" rx="8" ry="11"
                     stroke="rgba(255,255,255,0.85)" stroke-width="2"
                     transform="rotate(-25,82,0)"/>
            <!-- string cross -->
            <line x1="76" y1="-5" x2="88" y2="5"  stroke="rgba(255,255,255,0.28)" stroke-width="0.9"/>
            <line x1="76" y1="5"  x2="88" y2="-5" stroke="rgba(255,255,255,0.28)" stroke-width="0.9"/>
          </g>

          <!-- head -->
          <circle cx="40" cy="12" r="12" fill="rgba(255,255,255,0.09)" stroke="white" stroke-width="2.5"/>
          <!-- eyes (look toward net) -->
          <circle cx="37" cy="10" r="2"   fill="white"/>
          <circle cx="45" cy="10" r="2"   fill="white"/>
          <!-- pupils -->
          <circle cx="38" cy="10" r="0.9" fill="#0a1628"/>
          <circle cx="46" cy="10" r="0.9" fill="#0a1628"/>
          <!-- smile -->
          <path d="M 35 17 Q 40 22 45 17" stroke="white" stroke-width="1.7" fill="none" stroke-linecap="round"/>
          <!-- cheek blush dots -->
          <circle cx="33" cy="15" r="2.5" fill="rgba(255,160,160,0.35)"/>
          <circle cx="47" cy="15" r="2.5" fill="rgba(255,160,160,0.35)"/>
          <!-- hair tufts -->
          <line x1="33" y1="2"  x2="31" y2="-6" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="40" y1="0"  x2="40" y2="-8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="47" y1="2"  x2="49" y2="-6" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        </svg>

        <!-- Net post -->
        <div class="il-net"></div>

        <!-- Right player — identical SVG, CSS mirrors it and uses p2 arm timing -->
        <svg class="il-player il-player--right"
             viewBox="-5 -14 95 102"
             width="80" height="80"
             fill="none" xmlns="http://www.w3.org/2000/svg">

          <ellipse cx="40" cy="88" rx="15" ry="3" fill="rgba(0,0,0,0.22)"/>
          <line x1="40" y1="55" x2="27" y2="80" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <line x1="40" y1="55" x2="53" y2="80" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <line x1="27" y1="80" x2="17" y2="80" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <line x1="53" y1="80" x2="63" y2="80" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <line x1="40" y1="24" x2="40" y2="55" stroke="white" stroke-width="3" stroke-linecap="round"/>
          <line x1="40" y1="34" x2="17" y2="46" stroke="white" stroke-width="2.2" stroke-linecap="round"/>

          <g class="il-arm il-arm--p2" style="transform-origin:40px 34px">
            <line x1="40" y1="34" x2="60" y2="23" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
            <line x1="60" y1="23" x2="70" y2="13" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <line x1="70" y1="13" x2="77" y2="5" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round"/>
            <ellipse cx="82" cy="0" rx="8" ry="11"
                     stroke="rgba(255,255,255,0.85)" stroke-width="2"
                     transform="rotate(-25,82,0)"/>
            <line x1="76" y1="-5" x2="88" y2="5"  stroke="rgba(255,255,255,0.28)" stroke-width="0.9"/>
            <line x1="76" y1="5"  x2="88" y2="-5" stroke="rgba(255,255,255,0.28)" stroke-width="0.9"/>
          </g>

          <circle cx="40" cy="12" r="12" fill="rgba(255,255,255,0.09)" stroke="white" stroke-width="2.5"/>
          <circle cx="37" cy="10" r="2"   fill="white"/>
          <circle cx="45" cy="10" r="2"   fill="white"/>
          <circle cx="38" cy="10" r="0.9" fill="#0a1628"/>
          <circle cx="46" cy="10" r="0.9" fill="#0a1628"/>
          <path d="M 35 17 Q 40 22 45 17" stroke="white" stroke-width="1.7" fill="none" stroke-linecap="round"/>
          <circle cx="33" cy="15" r="2.5" fill="rgba(255,160,160,0.35)"/>
          <circle cx="47" cy="15" r="2.5" fill="rgba(255,160,160,0.35)"/>
          <line x1="33" y1="2"  x2="31" y2="-6" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="40" y1="0"  x2="40" y2="-8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="47" y1="2"  x2="49" y2="-6" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        </svg>

        <!-- A lightweight vector shuttle, with its cork facing the flight direction. -->
        <div class="il-flight">
          <div class="il-shuttle-wrap">
            <svg class="il-shuttle" viewBox="0 0 40 24" fill="none">
              <path class="il-trail" d="M0 9h9M3 15h6" stroke="currentColor" stroke-linecap="round"/>
              <path d="M12 3 29 9v6L12 21 9 12Z" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="m12 3 13 9-13 9M9 12h20" stroke="currentColor" stroke-width="1.2"/>
              <path d="M28 8h4a4 4 0 0 1 0 8h-4Z" fill="currentColor"/>
            </svg>
          </div>
        </div>

        <!-- Court floor line -->
        <div class="il-floor"></div>

      </div><!-- /.il-scene -->

      <!-- Text -->
      <div class="il-text">
        <div class="il-title">LOADING...</div>
      </div>

    </div>
    <!-- ────────────────────────────────────────────────────────────────────── -->

    <div id="root"></div>

    <script>
      window.__INITIAL_LOADER_START__ = (window.performance && performance.now) ? performance.now() : Date.now();
    </script>

    <style>
      #initial-loader {
        --il-bg: #f8f9fc;
        --il-ink: #1c3c6f;
        --il-muted: #66758c;
        --il-line: rgba(28,60,111,.15);
        --il-court: rgba(28,60,111,.035);
        --il-cycle: 2.8s;
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
        background: var(--il-bg);
        color: var(--il-ink);
        z-index: 9999;
        font-family: Inter, system-ui, sans-serif;
        transition: opacity 320ms ease;
      }
      [data-theme="dark"] #initial-loader {
        --il-bg: #0c1422;
        --il-ink: #d8e8ff;
        --il-muted: #98abc7;
        --il-line: rgba(169,202,255,.2);
        --il-court: rgba(169,202,255,.04);
      }
      #initial-loader.initial-loader--hide { opacity: 0; pointer-events: none; }
      .il-scene {
        --il-travel: calc(min(76vw, 360px) - 144px);
        position: relative;
        width: min(76vw, 360px);
        height: 180px;
        transform: scale(1.18);
        margin-block: 17px;
      }
      .il-scene::before {
        content: "";
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: -14px;
        height: 44px;
        border: 1px solid var(--il-line);
        border-radius: 50%;
        background: var(--il-court);
      }
      .il-player { position: absolute; bottom: 4px; overflow: visible; animation: il-ready var(--il-cycle) ease-in-out infinite; }
      .il-player--left { left: 0; }
      .il-player--right { right: 0; transform: scaleX(-1); animation-delay: -1.4s; }
      .il-player [stroke="white"], .il-player [stroke^="rgba(255,255,255"] { stroke: currentColor; }
      .il-player [fill="white"] { fill: currentColor; }
      .il-player [fill="rgba(255,255,255,0.09)"] { fill: var(--il-bg); }
      .il-player [fill="#0a1628"] { fill: var(--il-bg); }
      .il-player [fill="rgba(0,0,0,0.22)"] { fill: var(--il-line); }
      .il-arm { animation: il-swing var(--il-cycle) ease-in-out infinite; }
      .il-arm--p2 { animation-delay: -1.4s; }
      .il-net {
        position: absolute;
        left: 50%;
        bottom: 5px;
        height: 62px;
        width: 16px;
        transform: translateX(-50%);
        border: 1px solid var(--il-line);
        border-top: 2px solid currentColor;
        background: repeating-linear-gradient(0deg, transparent 0 7px, var(--il-line) 7px 8px), repeating-linear-gradient(90deg, transparent 0 7px, var(--il-line) 7px 8px);
      }
      .il-net::after { content: ""; position: absolute; left: 50%; top: -4px; bottom: -5px; border-left: 2px solid currentColor; }
      .il-floor { position: absolute; left: 8px; right: 8px; bottom: 4px; height: 1px; background: var(--il-line); }
      .il-flight { position: absolute; left: 62px; bottom: 62px; width: 20px; height: 20px; animation: il-cross-court var(--il-cycle) linear infinite; }
      .il-shuttle-wrap { width: 20px; height: 20px; animation: il-flight-arc 1.4s cubic-bezier(.33,0,.67,1) infinite; }
      .il-shuttle { width: 30px; height: 20px; overflow: visible; animation: il-heading var(--il-cycle) linear infinite; }
      .il-trail { opacity: .35; }
      .il-text { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 0 16px; }
      .il-title { font-size: 24px; font-weight: 800; letter-spacing: .13em; }
      @media (min-width: 600px) {
        .il-scene { transform: scale(1.5); margin-block: 45px; }
        .il-title { font-size: 28px; }
      }
      @keyframes il-cross-court {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(var(--il-travel)); }
      }
      @keyframes il-flight-arc {
        0%, 100% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.55,.55,1); }
        50% { transform: translateY(-64px); animation-timing-function: cubic-bezier(.45,0,.8,.45); }
      }
      @keyframes il-heading {
        0% { transform: rotate(-38deg); }
        24% { transform: rotate(0deg); }
        49.99% { transform: rotate(38deg); }
        50% { transform: rotate(218deg); }
        74% { transform: rotate(180deg); }
        99.99% { transform: rotate(142deg); }
        100% { transform: rotate(-38deg); }
      }
      @keyframes il-swing {
        0%, 100% { transform: rotate(0deg); }
        7% { transform: rotate(22deg); }
        22%, 72% { transform: rotate(-10deg); }
        90% { transform: rotate(-28deg); }
      }
      @keyframes il-ready {
        0%, 100% { translate: 0 0; }
        8% { translate: 2px -3px; }
        25%, 70% { translate: 0 0; }
        90% { translate: -1px 1px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-loader { transition-duration: 100ms; }
        .il-player, .il-arm, .il-flight, .il-shuttle-wrap, .il-shuttle { animation: none; }
        .il-flight { transform: translateX(calc(var(--il-travel) / 2)); }
        .il-shuttle-wrap { transform: translateY(-64px); }
      }
    </style>
  </body>
</html>
